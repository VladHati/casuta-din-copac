<svg viewBox="0 0 1000 660" xmlns="http://www.w3.org/2000/svg" role="img" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1000" height="660" fill="#ffffff"/>

  <text x="40" y="42" font-size="24" font-weight="bold" fill="#111111">COLTAR C2 — unde si cum</text>
  <text x="40" y="62" font-size="12" font-family="monospace" fill="#444444">1 coltar la FIECARE reazem joista-glulam · x12 acum, +4 la surori · varianta DE DEDESUBT (24.07)</text>

  <text x="60" y="108" font-size="13" font-weight="bold" fill="#111111" font-family="monospace">1 · DE DEDESUBT — regula generala</text>
  <text x="60" y="124" font-size="10" fill="#777777" font-family="monospace">(te uiti pe capatul glulamului; lucrezi de pe sol, cu mainile sus)</text>

  <rect x="60" y="200" width="460" height="80" fill="#f4f4f4" stroke="#111111" stroke-width="3"/>
  <text x="80" y="248" font-size="13" font-family="monospace" font-weight="bold" fill="#111111">JOISTA 100×100 (vine spre tine)</text>
  <rect x="300" y="280" width="76" height="170" fill="#e6e6e6" stroke="#111111" stroke-width="3"/>
  <text x="338" y="475" font-size="12" font-family="monospace" fill="#444444" text-anchor="middle">GLULAM</text>
  <text x="338" y="490" font-size="10" font-family="monospace" fill="#777777" text-anchor="middle">doar 90 gros!</text>

  <path d="M 215 280 L 300 280 L 300 287 L 215 287 Z" fill="#111111"/>
  <path d="M 293 287 L 300 287 L 300 365 L 293 365 Z" fill="#111111"/>

  <g stroke="#b3261e" stroke-width="4" stroke-linecap="round">
    <line x1="235" y1="284" x2="235" y2="216"/>
    <line x1="272" y1="284" x2="272" y2="216"/>
  </g>
  <g fill="#b3261e">
    <circle cx="235" cy="286" r="5"/><circle cx="272" cy="286" r="5"/>
  </g>
  <g stroke="#b3261e" stroke-width="4" stroke-linecap="round">
    <line x1="300" y1="305" x2="362" y2="305"/>
    <line x1="300" y1="330" x2="362" y2="330"/>
    <line x1="300" y1="355" x2="362" y2="355"/>
  </g>
  <g fill="#b3261e">
    <circle cx="297" cy="305" r="5"/><circle cx="297" cy="330" r="5"/><circle cx="297" cy="355" r="5"/>
  </g>
  <line x1="376" y1="280" x2="376" y2="450" stroke="#b3261e" stroke-width="1.5" stroke-dasharray="3 3"/>
  <text x="384" y="320" font-size="9.5" font-family="monospace" fill="#b3261e">varful ramane</text>
  <text x="384" y="333" font-size="9.5" font-family="monospace" fill="#b3261e">inauntru</text>

  <g font-family="monospace">
    <text x="60" y="330" font-size="13" font-weight="bold" fill="#b3261e">TOATE 5 = 6×80 · T30</text>
    <text x="60" y="350" font-size="10.5" fill="#111111">2× in SUS, in joista</text>
    <text x="60" y="365" font-size="10.5" fill="#111111">3× orizontal, in glulam</text>
    <text x="60" y="388" font-size="10.5" fill="#b3261e">6×100 INTERZIS aici:</text>
    <text x="60" y="402" font-size="10.5" fill="#b3261e">iese prin glulam (90)</text>
    <text x="60" y="416" font-size="10.5" fill="#b3261e">si prin joista (100)</text>
  </g>

  <text x="60" y="524" font-size="11" font-family="monospace" font-weight="bold" fill="#111111">EXCEPTIE — coltarele din colturile din SPATE (joistele de capat pe</text>
  <text x="60" y="539" font-size="11" font-family="monospace" font-weight="bold" fill="#111111">proeminenta; acum 2, +2 la surori): dedesubt e polita → DE SUS: 2× 6×80 + 3× 6×100.</text>
  <text x="60" y="558" font-size="10.5" font-family="monospace" fill="#111111">Ordine: clema tine joista → piciorul pe glulam (3×) → cele 2 in sus, in joista.</text>
  <text x="60" y="573" font-size="10.5" font-family="monospace" fill="#444444">Strans in colt, zero rost · GDR + T30 deasupra capului, tinut drept · ochelari.</text>

  <line x1="560" y1="90" x2="560" y2="580" stroke="#cccccc" stroke-width="1"/>
  <text x="590" y="108" font-size="13" font-weight="bold" fill="#111111" font-family="monospace">2 · VEDERE DE SUS</text>

  <rect x="590" y="180" width="380" height="56" fill="#e6e6e6" stroke="#111111" stroke-width="2.5"/>
  <text x="600" y="172" font-size="10.5" font-family="monospace" fill="#444444">glulam (te uiti de deasupra)</text>
  <rect x="700" y="120" width="62" height="180" fill="#f4f4f4" stroke="#111111" stroke-width="2.5"/>
  <text x="731" y="316" font-size="10.5" font-family="monospace" fill="#111111" text-anchor="middle">joista</text>
  <rect x="762" y="186" width="58" height="44" fill="#111111" opacity="0.9"/>
  <g fill="#ffffff">
    <circle cx="776" cy="198" r="3"/><circle cx="800" cy="198" r="3"/><circle cx="788" cy="218" r="3"/>
  </g>
  <line x1="820" y1="208" x2="850" y2="208" stroke="#111111" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="856" y="204" font-size="10.5" font-family="monospace" fill="#111111">coltarul pe partea</text>
  <text x="856" y="217" font-size="10.5" font-family="monospace" fill="#111111">dinspre CENTRU,</text>
  <text x="856" y="230" font-size="10.5" font-family="monospace" fill="#111111">aceeasi la toate</text>

  <text x="590" y="380" font-size="13" font-weight="bold" fill="#111111" font-family="monospace">3 · LA PERECHILE DE CAPAT</text>
  <rect x="590" y="400" width="30" height="120" fill="#f4f4f4" stroke="#111111" stroke-width="2.5"/>
  <rect x="620" y="400" width="30" height="120" fill="#f4f4f4" stroke="#111111" stroke-width="2.5"/>
  <rect x="650" y="440" width="34" height="34" fill="#111111" opacity="0.9"/>
  <text x="595" y="394" font-size="9.5" font-family="monospace" fill="#777777">marginea platformei</text>
  <line x1="584" y1="400" x2="584" y2="520" stroke="#b3261e" stroke-width="2"/>
  <text x="700" y="450" font-size="10.5" font-family="monospace" fill="#111111">fiecare din cele 2 lemne</text>
  <text x="700" y="464" font-size="10.5" font-family="monospace" fill="#111111">are coltarul LUI, pe fata</text>
  <text x="700" y="478" font-size="10.5" font-family="monospace" fill="#111111">dinspre interior — nimic</text>
  <text x="700" y="492" font-size="10.5" font-family="monospace" fill="#111111">pe marginea platformei</text>

  <text x="720" y="528" font-size="10.5" font-family="monospace" fill="#444444">12 pozitii acum (sloturile punctate = surori, mai tarziu):</text>
  <g>
    <rect x="720" y="536" width="200" height="10" fill="#e6e6e6" stroke="#111111" stroke-width="1.2"/>
    <rect x="720" y="596" width="200" height="10" fill="#e6e6e6" stroke="#111111" stroke-width="1.2"/>
    <g fill="#f4f4f4" stroke="#111111" stroke-width="1">
      <rect x="724" y="536" width="7" height="86"/><rect x="732" y="536" width="7" height="86" fill="none" stroke="#999999" stroke-dasharray="4 3"/>
      <rect x="748" y="536" width="7" height="86"/><rect x="784" y="536" width="7" height="86"/>
      <rect x="818" y="536" width="7" height="86"/><rect x="854" y="536" width="7" height="86"/>
      <rect x="905" y="536" width="7" height="86" fill="none" stroke="#999999" stroke-dasharray="4 3"/><rect x="913" y="536" width="7" height="86"/>
    </g>
    <g fill="#b3261e">
      <circle cx="741" cy="541" r="2.6"/><circle cx="741" cy="601" r="2.6"/>
      <circle cx="757" cy="541" r="2.6"/><circle cx="757" cy="601" r="2.6"/>
      <circle cx="793" cy="541" r="2.6"/><circle cx="793" cy="601" r="2.6"/>
      <circle cx="827" cy="541" r="2.6"/><circle cx="827" cy="601" r="2.6"/>
      <circle cx="863" cy="541" r="2.6"/><circle cx="863" cy="601" r="2.6"/>
      <circle cx="901" cy="541" r="2.6"/><circle cx="901" cy="601" r="2.6"/>
      <circle cx="719" cy="541" r="2.6"/><circle cx="719" cy="601" r="2.6"/>
      <circle cx="925" cy="541" r="2.6"/><circle cx="925" cy="601" r="2.6"/>
    </g>
  </g>

  <line x1="40" y1="600" x2="540" y2="600" stroke="#cccccc" stroke-width="1"/>
  <text x="40" y="626" font-size="12" font-family="monospace" fill="#111111" font-weight="bold">ACUM (6 joiste): 12 coltare — 10 jos (5× 6×80) + 2 sus, colturi-spate (2× 6×80 + 3× 6×100)</text>
  <text x="40" y="644" font-size="10.5" font-family="monospace" fill="#444444">acum: ~87× 6×80 (+1 pachet recomandat) · ~6× 6×100 · la surori, inainte de CASA: +4 C2, +14× 6×80, +22× 6×100</text>
</svg>
